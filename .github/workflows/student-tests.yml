name: Student tests (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  student-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - run: uv run pytest tests -m "not slow" -q
      - name: Optional tiny overfit test
        if: always()
        run: uv run pytest tests -m slow -q
